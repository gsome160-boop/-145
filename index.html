<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمع للقران الكريم مجانا</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; text-align: center; }
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a5235; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s ease; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; border: 2px solid #333; }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        #surahTextDisplay { margin-top: 20px; padding: 15px; background: #e0f7fa; border-radius: 5px; min-height: 100px; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1>"خيركم من تعلم القرآن وعلمه"</h1>
    <p>برمجة: ابوالقاسم البشرى</p>
</div>

<div class="container">
    <h2>قسم الاستماع</h2>
    <input type="text" id="searchInput" placeholder="ابحث باسم السورة...">
    <select id="surahSelect"></select>
    <select id="reciterSelect">
        <option value="api:ar.alafasy">مشاري العفاسي (سيرفر ذكي)</option>
        <option value="api:ar.haithamaldukhin">هيثم الدخين (سيرفر ذكي)</option>
        <option value="https://server7.mp3quran.net/basit/">عبد الباسط عبد الصمد</option>
        <option value="https://server11.mp3quran.net/yasser/">ياسر الدوسري</option>
        <option value="https://server13.mp3quran.net/husr/">الحصري</option>
    </select>
    <button id="playPauseBtn" onclick="togglePlay()">بدء</button>
    <div id="surahTextDisplay">اختر سورة للبدء</div>
    
    <hr>
    <h3>قسم التسبيح</h3>
    <h1 id="count">0</h1>
    <button onclick="increment()">اضغط للتسبيح</button>
    <button onclick="resetCounter()">تصفير</button>
</div>

<audio id="audioPlayer"></audio>

<script>
    const surahList = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];

    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const select = document.getElementById('surahSelect');
    const reciterSelect = document.getElementById('reciterSelect');
    const searchInput = document.getElementById('searchInput');
    const display = document.getElementById('surahTextDisplay');

    function updateSelect(list) {
        select.innerHTML = '';
        list.forEach((name) => {
            let opt = document.createElement("option");
            let realIndex = surahList.indexOf(name) + 1;
            opt.value = realIndex.toString().padStart(3, '0');
            opt.text = name;
            select.add(opt);
        });
    }

    updateSelect(surahList);

    searchInput.addEventListener('input', () => {
        const filtered = surahList.filter(s => s.includes(searchInput.value));
        updateSelect(filtered);
    });

    function loadAudio(callback) {
        audioPlayer.pause();
        const reciterValue = reciterSelect.value;
        const surahValue = select.value;
        
        // التحقق إذا كان القارئ يعتمد على نظام الـ API السحابي
        if (reciterValue.startsWith("api:")) {
            const identifier = reciterValue.replace("api:", "");
            const surahNumber = parseInt(surahValue, 10);
            
            fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${identifier}`)
                .then(res => res.json())
                .then(data => {
                    // الـ API الخاص بالسور الكاملة يعطي رابط الملف الصوتي للسورة كاملة عبر الآية الأولى
                    audioPlayer.src = data.data.ayahs[0].audio;
                    if (callback) callback();
                })
                .catch(err => {
                    console.error("خطأ في جلب السيرفر السحابي:", err);
                    display.innerText = "خطأ في تحميل السيرفر، جرب مرة أخرى.";
                });
        } else {
            // السيرفرات العادية المباشرة
            audioPlayer.src = reciterValue + surahValue + ".mp3";
            if (callback) callback();
        }
    }

    select.addEventListener('change', () => {
        loadAudio(() => {
            playPauseBtn.innerText = "بدء";
            display.innerText = "السورة المختارة: " + select.options[select.selectedIndex].text;
        });
    });

    reciterSelect.addEventListener('change', () => {
        loadAudio(() => {
            playPauseBtn.innerText = "بدء";
        });
    });

    function togglePlay() {
        if (!audioPlayer.src || audioPlayer.src === window.location.href) {
            loadAudio(() => {
                startPlayback();
            });
        } else {
            if (audioPlayer.paused) {
                startPlayback();
            } else {
                audioPlayer.pause();
                playPauseBtn.innerText = "بدء";
            }
        }
    }

    function startPlayback() {
        audioPlayer.play()
            .then(() => {
                playPauseBtn.innerText = "توقف";
                display.innerText = "أنت تستمع إلى: " + select.options[select.selectedIndex].text;
            })
            .catch(err => {
                // في حال حدوث انتهاء لجلسة الرابط أو الحماية، يعيد البناء والتشغيل تلقائياً
                loadAudio(() => {
                    audioPlayer.play();
                    playPauseBtn.innerText = "توقف";
                });
            });
    }

    function increment() { 
        let c = document.getElementById('count'); 
        c.innerText = parseInt(c.innerText) + 1; 
    }
    
    function resetCounter() { 
        document.getElementById('count').innerText = 0; 
    }

    setTimeout(() => {
        const overlay = document.getElementById('intro-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 1000);
    }, 3000);
</script>
</body>
</html>
