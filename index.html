<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع القرآن الكريم</title>
    <style>
        /* الأنيميشن الترحيبي */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a5235; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; animation: fadeOut 2s ease-in-out 2s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        body { font-family: 'Arial', sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .tasbeeh-box { background: #fff; padding: 20px; margin-top: 30px; border-radius: 15px; border: 2px solid #1a5235; display: inline-block; width: 80%; max-width: 400px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #1a5235; color: #fff; border: none; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- الأنيميشن الترحيبي -->
    <div id="intro-overlay">
        <h1>"خَيرُكُم مَن تَعَلَّمَ القُرآنَ وَعَلَّمَه"</h1>
        <p>المبرمج: أبوالقاسم البشرى</p>
    </div>

    <!-- المحتوى -->
    <h1>موقع القرآن الكريم</h1>
    
    <div class="tasbeeh-box">
        <h3>قائمة التسبيح</h3>
        <h2 id="counter">0</h2>
        <button onclick="count()">اضغط للتسبيح</button>
        <button onclick="reset()" style="background: #d9534f;">تصفير</button>
    </div>

    <script>
        let c = 0;
        function count() { c++; document.getElementById('counter').innerText = c; }
        function reset() { c = 0; document.getElementById('counter').innerText = c; }
    </script>
</body>
</html>
