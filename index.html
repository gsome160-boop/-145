<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع القرآن الكريم</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; text-align: center; }
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a5235; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; border: 2px solid #333; }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; }
        #surahTextDisplay { margin-top: 20px; padding: 15px; background: #e0f7fa; border-radius: 5px; min-height: 100px; }
    </style>
</head>
<body>

<div id="intro-overlay" onclick="this.style.display='none'">
    <h1>"خيركم من تعلم القرآن وعلمه"</h1>
    <p>المبرمج: أبو القاسم (اضغط للدخول)</p>
</div>

<div class="container">
    <h2>قسم الاستماع</h2>
    <select id="surahSelect"></select>
    <button id="playPauseBtn" onclick="togglePlay()">بدء</button>
    <div id="surahTextDisplay">اختر سورة للبدء</div>
    
    <hr>
    <h3>قسم التسبيح</h3>
    <h1 id="count">0</h1>
    <button onclick="increment()">اضغط للتسبيح</button>
    <button onclick="reset()">تصفير</button>
</div>

<audio id="audioPlayer"></audio>

<script>
    const surahData = [
        {name: "الفاتحة", id: "001", text: "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ..."},
        {name: "البقرة", id: "002", text: "الم... ذَلِكَ الْكِتَابُ..."}
    ];

    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const select = document.getElementById('surahSelect');
    const display = document.getElementById('surahTextDisplay');

    // تعبئة القائمة
    surahData.forEach(s => {
        let opt = document.createElement("option");
        opt.value = s.id;
        opt.text = s.name;
        select.add(opt);
    });

    // تشغيل الصوت عند الاختيار
    select.addEventListener('change', () => {
        let s = surahData.find(item => item.id === select.value);
        audioPlayer.src = `https://server11.mp3quran.net/yasser/${select.value}.mp3`;
        display.innerText = s ? s.text : "النص غير متوفر";
        audioPlayer.play();
        playPauseBtn.innerText = "توقف";
    });

    function togglePlay() {
        if (audioPlayer.paused) {
            audioPlayer.play();
            playPauseBtn.innerText = "توقف";
        } else {
            audioPlayer.pause();
            playPauseBtn.innerText = "بدء";
        }
    }

    let count = 0;
    function increment() { count++; document.getElementById('count').innerText = count; }
    function reset() { count = 0; document.getElementById('count').innerText = count; }
</script>
</body>
</html>
