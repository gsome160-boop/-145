<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع القرآن الكريم</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; border: 2px solid #333; }
        select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        #displaySurah { font-size: 1.5em; font-weight: bold; margin-top: 15px; color: #38bdf8; }
        .counter-section { margin-top: 20px; border-top: 2px solid #333; padding-top: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>قسم الاستماع</h2>
    <select id="surahSelect"></select>
    <audio id="audioPlayer" controls style="width: 100%;"></audio>
    <p id="displaySurah"></p>

    <div class="counter-section">
        <h3>قسم التسبيح</h3>
        <h1 id="count">0</h1>
        <button onclick="increment()">اضغط للتسبيح</button>
        <button onclick="reset()">تصفير</button>
    </div>
</div>

<script>
    const surahs = [
        "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
        "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
        "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
        "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
        "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
        "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
        "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
        "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
        "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
        "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
        "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
        "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    const surahSelect = document.getElementById('surahSelect');
    const displaySurah = document.getElementById('displaySurah');
    let count = 0;

    surahs.forEach((name) => {
        let option = document.createElement("option");
        option.text = "سورة " + name;
        surahSelect.add(option);
    });

    surahSelect.addEventListener('change', function() {
        displaySurah.innerText = surahSelect.options[surahSelect.selectedIndex].text;
    });

    displaySurah.innerText = surahSelect.options[0].text;

    function increment() {
        count++;
        document.getElementById('count').innerText = count;
    }
    function reset() {
        count = 0;
        document.getElementById('count').innerText = count;
    }
</script>
</body>
</html>
