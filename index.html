<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق القرآن الكريم</title>
    <style>
        /* الأنيميشن الترحيبي */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a5235; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; animation: fadeOut 2s ease-in-out 2s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        body { font-family: 'Arial', sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .box { background: #fff; padding: 20px; margin: 10px auto; border-radius: 15px; border: 2px solid #1a5235; width: 90%; max-width: 500px; }
        select, input { padding: 10px; margin: 5px; width: 90%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; background: #1a5235; color: #fff; border: none; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <h1>"خَيرُكُم مَن تَعَلَّمَ القُرآنَ وَعَلَّمَه"</h1>
        <p>المبرمج: أبوالقاسم البشرى</p>
    </div>

    <h1>موقع القرآن الكريم</h1>

    <div class="box">
        <h3>قسم الاستماع</h3>
        <input type="text" id="search" placeholder="ابحث باسم السورة (بدون حركات)..." oninput="filterSurahs()">
        <select id="surah-select" onchange="playSurah()"></select>
        <select id="reciter-select" onchange="playSurah()">
            <option value="https://server11.mp3quran.net/yasser/">ياسر الدوسري</option>
            <option value="https://server13.mp3quran.net/husr/">الحصري</option>
        </select>
        <audio id="audio" controls style="display:block; width:100%; margin-top:10px;"></audio>
    </div>

    <div class="box">
        <h3>قسم التسبيح</h3>
        <h2 id="counter">0</h2>
        <button onclick="count()">اضغط للتسبيح</button>
        <button onclick="reset()" style="background: #d9534f;">تصفير</button>
    </div>

    <script>
        let allSurahs = [];

        // دالة تنظيف النص من الحركات
        function cleanText(text) {
            return text.replace(/[\u064B-\u065F\u0670]/g, "")
                       .replace(/[أإآ]/g, "ا")
                       .replace(/ة/g, "ه");
        }

        fetch('https://api.alquran.cloud/v1/surah').then(res => res.json()).then(data => {
            allSurahs = data.data;
            populateSelect(allSurahs);
        });

        function populateSelect(list) {
            const select = document.getElementById('surah-select');
            select.innerHTML = '';
            list.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.number; opt.text = s.name; select.appendChild(opt);
            });
        }

        function filterSurahs() {
            const query = cleanText(document.getElementById('search').value);
            const filtered = allSurahs.filter(s => cleanText(s.name).includes(query));
            populateSelect(filtered);
        }

        function playSurah() {
            const num = document.getElementById('surah-select').value.padStart(3, '0');
            const reciter = document.getElementById('reciter-select').value;
            document.getElementById('audio').src = reciter + num + '.mp3';
        }

        let c = 0;
        function count() { c++; document.getElementById('counter').innerText = c; }
        function reset() { c = 0; document.getElementById('counter').innerText = c; }
    </script>
</body>
</html>
