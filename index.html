<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran App</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; text-align: center; }
        .hidden { display: none !important; }
        
        /* شاشات البداية */
        #intro-overlay, #lang-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a5235; color: #fff; }
        #lang-overlay { background: #fff; color: #1a5235; }
        .lang-btn { padding: 15px 30px; margin: 10px; font-size: 20px; cursor: pointer; background: #1a5235; color: #fff; border: none; border-radius: 10px; }
        
        /* التبويبات */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #ddd; }
        .tab-btn.active { background: #1a5235; color: #fff; }
        .content { display: none; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .content.active { display: block; }
        
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>

    <div id="intro-overlay" style="animation: fadeOut 1.5s ease-in-out 2s forwards;">
        <h2>"خَيرُكُم مَن تَعَلَّمَ القُرآنَ وَعَلَّمَه"</h2>
    </div>

    <div id="lang-overlay" class="hidden">
        <h2 id="lang-header">اختر اللغة / Select Language</h2>
        <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
    </div>

    <div id="main-content" class="hidden">
        <h1 id="main-title">موقع القرآن الكريم</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('listen')">استماع</button>
            <button class="tab-btn" onclick="showTab('read')">قراءة</button>
            <button class="tab-btn" onclick="showTab('tasbeeh')">تسبيح</button>
        </div>

        <div id="listen" class="content active">
            <select id="surah-select" style="width: 80%; padding: 10px;"></select>
            <br><br>
            <audio id="audio" controls></audio>
        </div>

        <div id="read" class="content">
            <p>قسم قراءة القرآن الكريم</p>
        </div>

        <div id="tasbeeh" class="content">
            <h2 id="counter">0</h2>
            <button onclick="count()" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">اضغط للتسبيح</button>
        </div>
    </div>

    <script>
        // إظهار اختيار اللغة
        setTimeout(() => { document.getElementById('lang-overlay').classList.remove('hidden'); }, 3500);

        function setLanguage(lang) {
            document.getElementById('lang-overlay').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            if(lang === 'en') {
                document.documentElement.dir = 'ltr';
                document.getElementById('main-title').innerText = 'Holy Quran Website';
                document.getElementById('lang-header').innerText = 'Select Language';
            }
        }

        function showTab(id) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        let c = 0;
        function count() { c++; document.getElementById('counter').innerText = c; }

        fetch('https://api.alquran.cloud/v1/surah')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('surah-select');
                data.data.forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s.number;
                    opt.text = s.name;
                    select.appendChild(opt);
                });
            });
    </script>
</body>
</html>
